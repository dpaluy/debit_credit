name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Ruby 4.x, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
    env:
      DB: ${{ matrix.db }}
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: debitcredit_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: debitcredit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Prepare database
        run: |
          bundle exec rake dummy:boot
          RAILS_ENV=test bundle exec rake app:db:migrate
      - name: Test
        run: bundle exec rake test

  style:
    name: Style (RuboCop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rake style

  build:
    name: Build gem
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Build gem
        run: |
          gem build debitcredit-ledger.gemspec
          test -f debitcredit-ledger-1.0.0.gem
      - name: Verify package contents
        run: |
          ruby -e '
            require "rubygems/package"
            files = Gem::Package.new("debitcredit-ledger-1.0.0.gem").contents
            excluded = files.select { |f| f.start_with?("test/", ".github/", "spec/", "pkg/") || f == "Gemfile.lock" || f.end_with?(".gem") }
            raise "Excluded paths in gem: #{excluded.inspect}" unless excluded.empty?
            required = %w[lib/debitcredit.rb lib/debitcredit/version.rb lib/debitcredit/engine.rb app/models/debitcredit/account.rb config/locales/en.yml MIT-LICENSE Rakefile README.md]
            missing = required - files
            raise "Missing required files: #{missing.inspect}" unless missing.empty?
            puts "Package contents verified: #{files.size} files"
          '

  install_smoke:
    name: Install + require smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Build gem
        run: gem build debitcredit-ledger.gemspec
      - name: Install into throwaway GEM_HOME
        run: |
          gem install --install-dir /tmp/dc-gemhouse --no-document ./debitcredit-ledger-1.0.0.gem
      - name: Require smoke
        run: |
          GEM_HOME=/tmp/dc-gemhouse GEM_PATH=/tmp/dc-gemhouse ruby -e '
            require "bundler/setup"
            require "rails"
            require "debitcredit"
            raise "VERSION mismatch" unless Debitcredit::VERSION == "1.0.0"
            puts "Debitcredit::VERSION = #{Debitcredit::VERSION}"
            puts "Debitcredit::Engine = #{Debitcredit::Engine}"
          '
